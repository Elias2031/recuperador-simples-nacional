{% extends 'accounts/login_base.html' %}
{% load static %}

{% block title %}Morpho | Cadastro{% endblock %}

{% block content %}
<div class="login-card text-center">
  <img src="{% static 'img/logo_morpho.png' %}" alt="Morpho" width="80" class="mb-3">
  <h3 class="morpho-title mb-0">Morpho</h3>
  <p class="morpho-subtitle mb-4">Recuperador Tributário</p>

  <form method="post" class="text-start">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Nome completo</label>
      <input type="text" name="nome" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">E-mail</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Senha</label>
      <input type="password" name="senha" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirmar senha</label>
      <input type="password" name="confirmar_senha" class="form-control" required>
    </div>
    <div class="d-grid">
      <button type="submit" class="btn btn-success">Cadastrar</button>
    </div>
  </form>

  <div class="mt-3">
    <a href="{% url 'login' %}">Já tem uma conta? Entrar</a>
  </div>
</div>
{% endblock %}
