{% extends 'accounts/login_base.html' %}

{% block title %}Morpho | Nova senha{% endblock %}

{% block content %}
<div class="login-card text-center">
  <h4 class="morpho-title mb-3">🔐 Criar nova senha</h4>
  <form method="post" class="text-start">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="d-grid">
      <button type="submit" class="btn btn-success">Salvar nova senha</button>
    </div>
  </form>
</div>
{% endblock %}
