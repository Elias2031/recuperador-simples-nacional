{% extends 'accounts/login_base.html' %}
{% load static %}

{% block title %}Morpho | Esqueci minha senha{% endblock %}

{% block content %}
<div class="login-card text-center">
  <img src="{% static 'img/logo-morpho-automacao-contabil.png' %}" alt="Morpho" width="80" class="mb-3">
  <h3 class="morpho-title mb-0">Morpho</h3>
  <p class="morpho-subtitle mb-4">Recuperador Tributário</p>

  <form method="post" class="text-start">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Informe seu e-mail</label>
      {{ form.email }}
    </div>
    <div class="d-grid">
      <button type="submit" class="btn btn-warning">Enviar link de recuperação</button>
    </div>
  </form>

  <div class="mt-3">
    <a href="{% url 'login' %}">← Voltar para o login</a>
  </div>
</div>
{% endblock %}
